[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-broker"
version = "0.1.0"
description = "US market warehouse, screener API and MCP (EOD + open window)."
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2",
  "pandas>=2.2",
  "pyarrow>=17",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "mcp>=1.9,<2",
  "structlog>=24.4",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "boto3>=1.35",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
paper-broker = "paper_broker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_broker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
